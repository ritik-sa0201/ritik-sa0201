# Contribution Snake generator
# ---------------------------------------------------------------
# SETUP (2 steps):
# 1. Place this file at: .github/workflows/snake.yml
#    in your PROFILE repo (the repo named exactly "ritik-sa0201").
# 2. Nothing else to edit — GITHUB_TOKEN is provided automatically.
#    It pushes the generated SVG/GIF to a branch called "output",
#    which is exactly the branch referenced in the README image URL.
# ---------------------------------------------------------------
# After the first run (or wait for the daily schedule), the SVG
# will exist at:
#   https://raw.githubusercontent.com/<username>/<username>/output/github-contribution-grid-snake-dark.svg
# ---------------------------------------------------------------

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}    # allows manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4287f5,#2c69e0

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
