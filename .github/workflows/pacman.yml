# Pac-Man contribution graph generator
# ---------------------------------------------------------------
# SETUP (2 steps):
# 1. Place this file at: .github/workflows/pacman.yml
#    in your PROFILE repo (the repo named exactly "ritik-sa0201").
# 2. Nothing else to edit — GITHUB_TOKEN is provided automatically.
#    It pushes the generated SVGs to a branch called "output",
#    which is exactly the branch referenced in the README image URLs.
# ---------------------------------------------------------------
# After the first run (or wait for the daily schedule), the SVGs
# will exist at:
#   https://raw.githubusercontent.com/<username>/<username>/output/pacman-contribution-graph.svg
#   https://raw.githubusercontent.com/<username>/<username>/output/pacman-contribution-graph-dark.svg
#
# Other games available from the same action — just add to the
# comma-separated "games" list below and add a matching <picture>
# block in the README (swap "pacman" for the game name):
#   pacman | breakout | galaga | puzzle-bobble | bomberman | minesweeper
# ---------------------------------------------------------------

name: Generate Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}    # allows manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Comma-separated list of game names to generate.
          games: 'pacman'

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
